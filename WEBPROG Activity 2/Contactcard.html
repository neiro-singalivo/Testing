    <style>
      .contact-title {
        flex: 0 0 100%;
        text-align: center;
        margin: 0;
      }

      .Contactlinks {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        align-items: center;
        flex: 0 0 100%;
        margin-top: 0;
      }

      .Contactlinks a {
        display: inline-flex;
        align-items: center;
        justify-self: center;
        color: dodgerblue;
        font-weight: 600;
        font-size: 1.3rem;
        text-decoration: none;
        gap: 8px;
        transition: 0.2s;
      }

      .Contactlinks a:hover {
        text-decoration: underline;
        color: #0b2545;
        transform: translateY(-3px);
      }

      .Contactlinks i {
        font-size: 1.6rem;
        margin-right: 8px;
        width: 1.6rem;
        text-align: center;
      }
    </style>
  </head>
